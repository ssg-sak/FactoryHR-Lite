services:
  db:
    image: postgres:16-alpine
    container_name: factoryhr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factoryhr}
      POSTGRES_USER: ${POSTGRES_USER:-factoryhr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factoryhr}
    ports:
      - "5434:5432"
    volumes:
      - factoryhr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: factoryhr-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-factoryhr}:${POSTGRES_PASSWORD:-factoryhr}@db:5432/${POSTGRES_DB:-factoryhr}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      JWT_SECRET: ${JWT_SECRET:-dev-only-local-secret-not-for-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin-local}
      DEMO_VIEWER_USERNAME: ${DEMO_VIEWER_USERNAME:-viewer}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer-demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: factoryhr-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  factoryhr_postgres_data:
