databases:
  - name: factoryhr-db
    plan: free
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: factoryhr-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: factoryhr-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: factoryhr-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DEMO_VIEWER_USERNAME
        value: viewer
      - key: DEMO_VIEWER_PASSWORD
        value: viewer-demo

  - type: web
    name: factoryhr-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: factoryhr-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
